<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>3D Endless Moto Rider - Biker Player Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #a0c4ff; user-select: none; font-family: 'Arial', sans-serif; }
        #ui-container { position: absolute; top: 25px; left: 25px; color: white; text-shadow: 3px 3px 6px rgba(0,0,0,0.8); z-index: 10; display: none; }
        #score { font-size: 32px; font-weight: bold; letter-spacing: 1px; }
        #level { font-size: 22px; color: #FFD700; margin-top: 5px; font-weight: bold; }
        
        /* MODERN DIGITAL SPEEDOMETER */
        #speedometer-container {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 12px 20px;
            color: white;
            text-align: center;
            min-width: 110px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
        }
        #speed-number {
            font-size: 38px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        #speed-unit { font-size: 12px; color: #aaa; letter-spacing: 1px; margin-top: -2px; }
        #speed-bar-bg { width: 100%; height: 6px; background: #222; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        #speed-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ffcc, #ff3333); transition: width 0.1s ease; }

        #instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            text-shadow: 2px 2px 4px #000;
            z-index: 5;
            pointer-events: none;
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 20px;
            width: 50%;
            display: none;
        }

        /* DIFFICULTY MENU SCREEN */
        #menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
            text-align: center;
        }
        #menu-title { font-size: 50px; font-weight: bold; text-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 10px; color: #ff9f43; }
        #menu-subtitle { font-size: 20px; margin-bottom: 40px; color: #ddd; }
        .mode-btn {
            width: 250px; padding: 15px; font-size: 22px; font-weight: bold;
            color: white; border: none; border-radius: 30px; margin: 10px;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .mode-btn:hover { transform: scale(1.05); }
        #easy-btn { background: #22c55e; box-shadow: 0 5px 15px rgba(34,197,94,0.4); }
        #medium-btn { background: #eab308; box-shadow: 0 5px 15px rgba(234,179,8,0.4); }
        #difficult-btn { background: #ef4444; box-shadow: 0 5px 15px rgba(239,68,68,0.4); }

        /* GAME OVER SCREEN */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #game-over-screen.active { opacity: 1; pointer-events: auto; }
        #game-over-title { color: #ff3333; font-size: 55px; font-weight: bold; margin-bottom: 10px; }
        #final-score { color: white; font-size: 26px; margin-bottom: 25px; }
        #restart-btn {
            background: #22c55e; color: white; border: none; padding: 15px 45px;
            font-size: 22px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(34,197,94,0.4); margin-bottom: 15px;
        }
        #gameover-shop-btn {
            background: #ff9f43; color: white; border: none; padding: 12px 35px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,159,67,0.3);
        }

        /* UI SHOP SCREEN */
        #shop-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            color: white;
        }
        #shop-screen.active { opacity: 1; pointer-events: auto; }
        #shop-title { font-size: 45px; font-weight: bold; color: #ff9f43; margin-bottom: 5px; }
        #shop-coins { font-size: 24px; color: #FFD700; margin-bottom: 30px; }
        .shop-container { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; }
        .shop-item {
            background: #222; border: 3px solid #444; border-radius: 15px;
            padding: 20px; width: 130px; text-align: center; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .shop-item:hover { transform: scale(1.05); }
        .shop-item.selected { border-color: #22c55e; background: #113311; }
        .color-preview { width: 50px; height: 50px; margin: 0 auto 15px auto; border-radius: 50%; border: 2px solid white; }
        .item-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .item-cost { font-size: 14px; color: #FFD700; }
        #close-shop-btn { background: #e74c3c; color: white; border: none; padding: 12px 40px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-screen">
        <div id="menu-title">ENDLESS MOTO RIDER</div>
        <div id="menu-subtitle">SELECT YOUR DIFFICULTY MODE</div>
        <button class="mode-btn" id="easy-btn" onclick="startGameMode('easy')">🟢 EASY</button>
        <button class="mode-btn" id="medium-btn" onclick="startGameMode('medium')">🟡 MEDIUM</button>
        <button class="mode-btn" id="difficult-btn" onclick="startGameMode('difficult')">🔴 DIFFICULT</button>
    </div>

    <div id="ui-container">
        <div id="score">Coins/Score: 0</div>
        <div id="level">Level: 1</div>
    </div>

    <div id="speedometer-container">
        <div id="speed-number">0</div>
        <div id="speed-unit">KM/H</div>
        <div id="speed-bar-bg">
            <div id="speed-bar-fill"></div>
        </div>
    </div>

    <div id="instruction">SWIPE Left/Right to Slide | HOLD Screen for Nitro 🔥</div>

    <div id="game-over-screen">
        <div id="game-over-title">CRASHED!</div>
        <div id="final-score">Your Final Score: 0</div>
        <button id="restart-btn">PLAY AGAIN 🔄</button>
        <button id="gameover-shop-btn">GO TO SHOP 🛒</button>
    </div>

    <div id="shop-screen">
        <div id="shop-title">BIKE CUSTOM SHOP</div>
        <div id="shop-coins">Your Coins: 0</div>
        
        <div class="shop-container">
            <div class="shop-item selected" onclick="buyColor('red', 0, this)">
                <div class="color-preview" style="background: #ee0000;"></div>
                <div class="item-name">Stock Red</div>
                <div class="item-cost">UNLOCKED</div>
            </div>
            <div class="shop-item" id="item-blue" onclick="buyColor('blue', 150, this)">
                <div class="color-preview" style="background: #0044ff;"></div>
                <div class="item-name">Neon Blue</div>
                <div class="item-cost">Cost: 150</div>
            </div>
            <div class="shop-item" id="item-green" onclick="buyColor('green', 350, this)">
                <div class="color-preview" style="background: #00aa22;"></div>
                <div class="item-name">Green Viper</div>
                <div class="item-cost">Cost: 350</div>
            </div>
            <div class="shop-item" id="item-gold" onclick="buyColor('gold', 800, this)">
                <div class="color-preview" style="background: #d4af37;"></div>
                <div class="item-name">Pure Gold</div>
                <div class="item-cost">Cost: 800</div>
            </div>
        </div>

        <button id="close-shop-btn">BACK TO UI 🏁</button>
    </div>

    <script>
        // --- AUDIO GENERATOR ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let engineOsc = null; let engineGain = null;

        function startEngineSound() {
            if (engineOsc || isShopOpen || !gameRunning || gameOver) return;
            try {
                engineOsc = audioCtx.createOscillator(); engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(50, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination);
                engineOsc.start();
            } catch(e) {}
        }

        function stopEngineSound() {
            if (engineOsc) { try { engineOsc.stop(); engineOsc = null; } catch(e){} }
        }

        function updateEnginePitch(level, isNitro) { 
            if (engineOsc) { 
                let base = 50 + (level * 10);
                if (isNitro) base *= 1.8;
                engineOsc.frequency.setValueAtTime(base, audioCtx.currentTime); 
            } 
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'horn') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(380, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.35);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'gameover') {
                stopEngineSound();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            }
        }

        // --- GAME SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0c4ff);
        scene.fog = new THREE.FogExp2(0xa0c4ff, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const dirLight = new THREE.DirectionalLight(0xffe6a7, 1.6);
        dirLight.position.set(20, 40, 20); scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0x888888));

        // --- BIKE MODEL WITH COLOR SYSTEM ---
        const playerGroup = new THREE.Group();
        const bikeMaterials = {
            red: new THREE.MeshLambertMaterial({ color: 0xee0000 }),
            blue: new THREE.MeshLambertMaterial({ color: 0x0044ff }),
            green: new THREE.MeshLambertMaterial({ color: 0x00aa22 }),
            gold: new THREE.MeshLambertMaterial({ color: 0xd4af37 })
        };
        const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const silverMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });

        let bikeBodyMesh, bikeTankMesh;
        bikeBodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.35, 1.0), bikeMaterials.red); bikeBodyMesh.position.y = 0.45; playerGroup.add(bikeBodyMesh);
        bikeTankMesh = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.2, 0.4), bikeMaterials.red); bikeTankMesh.position.set(0, 0.6, -0.1); playerGroup.add(bikeTankMesh);
        
        const seat = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.05, 0.3), blackMat); seat.position.set(0, 0.55, 0.2); playerGroup.add(seat);
        const engine = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.2, 0.3), silverMat); engine.position.set(0, 0.3, 0.0); playerGroup.add(engine);
        
        const whGeom = new THREE.CylinderGeometry(0.25, 0.25, 0.15, 24); whGeom.rotateZ(Math.PI / 2);
        const fWheel = new THREE.Mesh(whGeom, blackMat); fWheel.position.set(0, 0.25, -0.6); playerGroup.add(fWheel);
        const bWheel = new THREE.Mesh(whGeom, blackMat); bWheel.position.set(0, 0.25, 0.6); playerGroup.add(bWheel);
        
        const fork = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.6), silverMat); fork.position.set(0, 0.5, -0.45); fork.rotation.x = -0.2; playerGroup.add(fork);
        const handlebars = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.55, 8), silverMat); handlebars.position.set(0, 0.75, -0.38); handlebars.rotateZ(Math.PI / 2); playerGroup.add(handlebars);
        
        const fireGeom = new THREE.ConeGeometry(0.1, 0.4, 8); fireGeom.rotateX(Math.PI / 2);
        const fireMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0 });
        const nitroFire = new THREE.Mesh(fireGeom, fireMat); nitroFire.position.set(0, 0.3, 0.8); playerGroup.add(nitroFire);

        // --- DETAILED HUMAN RIDER (PLAYER) CHARACTER ---
        const riderGroup = new THREE.Group();
        riderGroup.position.set(0, 0.55, 0.1); // Sit right on the seat

        const jacketMat = new THREE.MeshLambertMaterial({ color: 0x1f1f1f }); // Black Leather Jacket
        const jeansMat = new THREE.MeshLambertMaterial({ color: 0x1d3557 });  // Blue Jeans
        const helmetMat = new THREE.MeshLambertMaterial({ color: 0xccff00 }); // Neon Yellow Safety Helmet
        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });   // Skin Color Face/Hands

        // Torso / Body (Leaning slightly forward)
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.38, 0.22), jacketMat);
        torso.position.set(0, 0.2, -0.05);
        torso.rotation.x = -0.3; // Racing forward lean
        riderGroup.add(torso);

        // Head & Helmet
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 0.42, -0.14);
        const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), helmetMat);
        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.12), blackMat);
        visor.position.set(0, 0.02, -0.07);
        headGroup.add(helmet, visor);
        riderGroup.add(headGroup);

        // Left & Right Arms (Reaching out to Handlebars)
        const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.3), jacketMat);
        leftArm.position.set(-0.15, 0.26, -0.2);
        leftArm.rotation.set(0.6, 0, -0.2);
        const rightArm = leftArm.clone();
        rightArm.position.x = 0.15;
        rightArm.rotation.z = 0.2;
        riderGroup.add(leftArm, rightArm);

        // Left & Right Legs (Grip on the sides of the bike body)
        const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.3, 0.12), jeansMat);
        leftLeg.position.set(-0.14, 0.02, -0.04);
        leftLeg.rotation.set(0.4, 0, 0.15);
        const rightLeg = leftLeg.clone();
        rightLeg.position.x = 0.14;
        rightLeg.rotation.z = -0.15;
        riderGroup.add(leftLeg, rightLeg);

        // Boots/Shoes
        const leftBoot = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.06, 0.14), blackMat);
        leftBoot.position.set(-0.14, -0.14, -0.02);
        const rightBoot = leftBoot.clone();
        rightBoot.position.x = 0.14;
        riderGroup.add(leftBoot, rightBoot);

        playerGroup.add(riderGroup);
        scene.add(playerGroup);

        // --- ENVIRONMENT ---
        const environmentGroup = new THREE.Group(); scene.add(environmentGroup);
        const road = new THREE.Mesh(new THREE.PlaneGeometry(9, 2000), new THREE.MeshLambertMaterial({ color: 0x242424 })); road.rotation.x = -Math.PI / 2; road.position.z = -900; environmentGroup.add(road);
        const lineGeom = new THREE.PlaneGeometry(0.15, 2000); const lineMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
        const leftLine = new THREE.Mesh(lineGeom, lineMat); leftLine.rotation.x = -Math.PI / 2; leftLine.position.set(-1.5, 0.01, -900); environmentGroup.add(leftLine);
        const rightLine = new THREE.Mesh(lineGeom, lineMat); rightLine.rotation.x = -Math.PI / 2; rightLine.position.set(1.5, 0.01, -900); environmentGroup.add(rightLine);

        const grassMat = new THREE.MeshLambertMaterial({ color: 0x415d32 });
        const lg = new THREE.Mesh(new THREE.PlaneGeometry(100, 2000), grassMat); lg.rotation.x = -Math.PI / 2; lg.position.set(-54.5, -0.01, -900); environmentGroup.add(lg);
        const rg = new THREE.Mesh(new THREE.PlaneGeometry(100, 2000), grassMat); rg.rotation.x = -Math.PI / 2; rg.position.set(54.5, -0.01, -900); environmentGroup.add(rg);

        function createFences() {
            const postGeom = new THREE.CylinderGeometry(0.04, 0.04, 0.8, 8); const barGeom = new THREE.BoxGeometry(0.02, 0.08, 6); const fMat = new THREE.MeshLambertMaterial({ color: 0x999999 });
            for (let z = 0; z > -600; z -= 6) {
                const lp = new THREE.Mesh(postGeom, fMat); lp.position.set(-4.5, 0.4, z); environmentGroup.add(lp);
                const rp = new THREE.Mesh(postGeom, fMat); rp.position.set(4.5, 0.4, z); environmentGroup.add(rp);
                const lb = new THREE.Mesh(barGeom, fMat); lb.position.set(-4.5, 0.45, z - 3); environmentGroup.add(lb);
                const rb = new THREE.Mesh(barGeom, fMat); rb.position.set(4.5, 0.45, z - 3); environmentGroup.add(rb);
            }
        }
        createFences();

        const mountainGroup = new THREE.Group(); scene.add(mountainGroup);
        function spawnMountains() {
            const mMat = new THREE.MeshLambertMaterial({ color: 0x54585e });
            for (let i = 0; i < 60; i++) {
                let h = 25 + Math.random() * 35; let r = 18 + Math.random() * 20;
                let m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 4), mMat); let side = Math.random() > 0.5 ? 1 : -1;
                m.position.set((30 + Math.random() * 50) * side, h / 2 - 2, -Math.random() * 900 - 30); mountainGroup.add(m);
            }
        }
        spawnMountains();

        const clouds = [];
        function createClouds() {
            const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
            for (let i = 0; i < 25; i++) {
                const cloudGroup = new THREE.Group(); const numSpheres = 5 + Math.floor(Math.random() * 4);
                for(let j=0; j<numSpheres; j++) {
                    const radius = 2.5 + Math.random() * 3; const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 12, 12), cloudMat);
                    mesh.position.set(j * 2.2 - (numSpheres * 0.8), Math.random() * 1.5, Math.random() * 1.5); cloudGroup.add(mesh);
                }
                cloudGroup.position.set(-70 + Math.random() * 140, 20 + Math.random() * 12, -Math.random() * 700 - 50);
                cloudGroup.userData = { speed: 0.02 + Math.random() * 0.04 }; scene.add(cloudGroup); clouds.push(cloudGroup);
            }
        }
        createClouds();

        // --- GAME CONFIGS & VARIABLES ---
        let items = []; let isNitroActive = false;
        let score = 0; let level = 1; let baseSpeed = 0.4; let gameSpeed = 0.4; 
        let gameOver = false; let isShopOpen = false; let gameRunning = false;
        const lanes = [-2.8, 0, 2.8]; let currentLaneIndex = 1;

        let currentMode = 'easy';
        const modeConfigs = {
            easy: { startSpeed: 0.4, spawnRate: 650, trafficProb: 0.40 },
            medium: { startSpeed: 0.55, spawnRate: 500, trafficProb: 0.55 },
            difficult: { startSpeed: 0.7, spawnRate: 380, trafficProb: 0.70 }
        };

        let totalCoinsBank = 0;
        let unlockedColors = { red: true, blue: false, green: false, gold: false };
        let spawnInterval = null;

        // --- DIFFICULTY SELECT TRIGGER ---
        function startGameMode(mode) {
            currentMode = mode;
            let config = modeConfigs[mode];
            
            baseSpeed = config.startSpeed;
            gameSpeed = config.startSpeed;
            
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            document.getElementById('speedometer-container').style.display = 'block';
            document.getElementById('instruction').style.display = 'block';
            
            gameRunning = true;
            triggerStart();

            if(spawnInterval) clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnTraffic, config.spawnRate);

            animate();
        }

        function spawnTraffic() {
            if (gameOver || isShopOpen || !gameRunning) return;
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)]; const rand = Math.random();
            let config = modeConfigs[currentMode];
            
            if (rand < config.trafficProb) { 
                const vehicle = new THREE.Group(); const isTruck = Math.random() > 0.65;
                const carColor = new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff });
                const tireMat = new THREE.MeshLambertMaterial({ color: 0x151515 });
                const glassMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

                if (isTruck) {
                    const cargo = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.4, 3.4), new THREE.MeshLambertMaterial({ color: 0x1055cc })); cargo.position.y = 1.0; vehicle.add(cargo);
                    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.9, 0.8), silverMat); cabin.position.set(0, 0.75, -1.9); vehicle.add(cabin);
                    const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 0.1), glassMat); windshield.position.set(0, 0.9, -2.31); vehicle.add(windshield);
                    
                    const tWheelG = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16); tWheelG.rotateZ(Math.PI/2);
                    for(let zPos of [-1.2, 0, 1.2]) {
                        let wL = new THREE.Mesh(tWheelG, tireMat); wL.position.set(-0.65, 0.3, zPos); vehicle.add(wL);
                        let wR = new THREE.Mesh(tWheelG, tireMat); wR.position.set(0.65, 0.3, zPos); vehicle.add(wR);
                    }
                    vehicle.userData = { type: 'enemy', height: 1.6, length: 4.2 };
                } else {
                    const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 2.2), carColor); carBody.position.y = 0.4; vehicle.add(carBody);
                    const carRoof = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.35, 1.1), carColor); carRoof.position.set(0, 0.75, 0.1); vehicle.add(carRoof);
                    const winF = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.1), glassMat); winF.position.set(0, 0.7, -0.5); winF.rotation.x = -0.4; vehicle.add(winF);
                    
                    const cWheelG = new THREE.CylinderGeometry(0.22, 0.22, 0.15, 16); cWheelG.rotateZ(Math.PI/2);
                    for(let zPos of [-0.7, 0.7]) {
                        let wL = new THREE.Mesh(cWheelG, tireMat); wL.position.set(-0.6, 0.22, zPos); vehicle.add(wL);
                        let wR = new THREE.Mesh(cWheelG, tireMat); wR.position.set(0.6, 0.22, zPos); vehicle.add(wR);
                    }
                    vehicle.userData = { type: 'enemy', height: 0.9, length: 2.4 };
                }
                vehicle.position.set(randomLane, 0, -110); scene.add(vehicle); items.push(vehicle);
                if(Math.random() > 0.75) playSound('horn');
            } else { 
                let count = 2 + Math.floor(Math.random() * 2);
                for(let k = 0; k < count; k++) {
                    const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.08, 16), new THREE.MeshLambertMaterial({ color: 0xFFD700 }));
                    coin.rotation.x = Math.PI / 2; coin.position.set(randomLane, 0.6, -110 - (k * 4)); coin.userData = { type: 'coin' };
                    scene.add(coin); items.push(coin);
                }
            }
        }

        // --- CONTROLS ---
        let startX = 0; let minSwipe = 35;
        function activateNitro() { if (gameOver || isShopOpen || !gameRunning) return; isNitroActive = true; gameSpeed = baseSpeed * 1.8; fireMat.opacity = 0.9; updateEnginePitch(level, true); }
        function deactivateNitro() { isNitroActive = false; gameSpeed = baseSpeed; fireMat.opacity = 0; updateEnginePitch(level, false); }
        function triggerStart() { if (audioCtx.state === 'suspended') audioCtx.resume(); startEngineSound(); }

        window.addEventListener('touchstart', (e) => { triggerStart(); startX = e.touches[0].clientX; activateNitro(); }, { passive: true });
        window.addEventListener('touchend', (e) => {
            deactivateNitro(); let endX = e.changedTouches[0].clientX; let diffX = endX - startX;
            if (Math.abs(diffX) > minSwipe) {
                if (diffX > 0 && currentLaneIndex < 2) currentLaneIndex++; else if (diffX < 0 && currentLaneIndex > 0) currentLaneIndex--;
                playerGroup.userData.targetX = lanes[currentLaneIndex];
            }
        }, { passive: true });

        window.addEventListener('mousedown', (e) => { if(e.target.id === 'gameover-shop-btn' || e.target.classList.contains('mode-btn')) return; triggerStart(); startX = e.clientX; activateNitro(); });
        window.addEventListener('mouseup', (e) => {
            deactivateNitro(); let diffX = e.clientX - startX;
            if (Math.abs(diffX) > minSwipe) {
                if (diffX > 0 && currentLaneIndex < 2) currentLaneIndex++; else if (diffX < 0 && currentLaneIndex > 0) currentLaneIndex--;
                playerGroup.userData.targetX = lanes[currentLaneIndex];
            }
        });

        window.addEventListener('keydown', (e) => {
            if(!gameRunning) return;
            triggerStart();
            if (e.code === 'ArrowLeft' && currentLaneIndex > 0) currentLaneIndex--;
            if (e.code === 'ArrowRight' && currentLaneIndex < 2) currentLaneIndex++;
            if (e.code === 'Space') activateNitro();
            playerGroup.userData.targetX = lanes[currentLaneIndex];
        });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space') deactivateNitro(); });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- SHOP LAYER SYSTEM ---
        const gameoverShopBtn = document.getElementById('gameover-shop-btn');
        const shopScreen = document.getElementById('shop-screen');
        const closeShopBtn = document.getElementById('close-shop-btn');

        gameoverShopBtn.addEventListener('click', () => {
            isShopOpen = true; deactivateNitro(); stopEngineSound();
            document.getElementById('shop-coins').innerText = "Your Coins: " + totalCoinsBank;
            shopScreen.classList.add('active');
        });

        closeShopBtn.addEventListener('click', () => {
            shopScreen.classList.remove('active'); isShopOpen = false;
        });

        function buyColor(colorName, cost, element) {
            if (unlockedColors[colorName]) {
                bikeBodyMesh.material = bikeMaterials[colorName]; bikeTankMesh.material = bikeMaterials[colorName];
                document.querySelectorAll('.shop-item').forEach(el => el.classList.remove('selected')); element.classList.add('selected');
            } else {
                if (totalCoinsBank >= cost) {
                    totalCoinsBank -= cost; unlockedColors[colorName] = true;
                    document.getElementById('shop-coins').innerText = "Your Coins: " + totalCoinsBank;
                    element.querySelector('.item-cost').innerText = "UNLOCKED";
                    bikeBodyMesh.material = bikeMaterials[colorName]; bikeTankMesh.material = bikeMaterials[colorName];
                    document.querySelectorAll('.shop-item').forEach(el => el.classList.remove('selected')); element.classList.add('selected');
                    playSound('coin');
                } else {
                    alert("Not enough coins! Collect more in the race.");
                }
            }
        }

        // RESTART GAME SYSTEM
        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.remove('active');
            for(let item of items) { scene.remove(item); } items = [];
            score = 0; level = 1; currentLaneIndex = 1;
            playerGroup.position.x = lanes[currentLaneIndex]; playerGroup.userData.targetX = lanes[currentLaneIndex];
            document.getElementById('score').innerText = "Coins/Score: 0"; document.getElementById('level').innerText = "Level: 1";
            gameOver = false; gameRunning = false;
            
            document.getElementById('menu-screen').style.display = 'flex';
        });

        playerGroup.position.x = lanes[currentLaneIndex]; playerGroup.userData.targetX = lanes[currentLaneIndex];
        camera.position.set(0, 3.2, 4.5); camera.lookAt(0, 1, -2);

        // --- MAIN CORE ANIMATION LOOP ---
        function animate() {
            if (gameOver || isShopOpen || !gameRunning) return;
            requestAnimationFrame(animate);

            playerGroup.position.x += (playerGroup.userData.targetX - playerGroup.position.x) * 0.25;

            let time = Date.now() * 0.05;
            if(!isNitroActive) playerGroup.position.y = 0 + Math.sin(time) * 0.015;
            else nitroFire.scale.set(1 + Math.sin(time)*0.2, 1, 1 + Math.cos(time)*0.2);

            let calculatedSpeed = Math.floor(gameSpeed * 250); 
            document.getElementById('speed-number').innerText = calculatedSpeed;
            let barPercentage = Math.min((calculatedSpeed / 350) * 100, 100);
            document.getElementById('speed-bar-fill').style.width = barPercentage + "%";

            for(let c of clouds) { c.position.z += c.userData.speed; if(c.position.z > 20) c.position.z = -600; }

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i]; item.position.z += gameSpeed;
                if (item.userData.type === 'coin') item.rotation.y += 0.06;

                let lenCheck = item.userData.type === 'enemy' ? item.userData.length/2 + 0.4 : 0.6;
                if (item.position.z > -lenCheck && item.position.z < lenCheck) {
                    let distanceX = Math.abs(item.position.x - playerGroup.position.x);
                    if (distanceX < 0.75) {
                        if (item.userData.type === 'enemy') {
                            gameOver = true; playSound('gameover'); deactivateNitro();
                            if(spawnInterval) clearInterval(spawnInterval);
                            document.getElementById('final-score').innerText = "Your Final Score: " + score;
                            document.getElementById('game-over-screen').classList.add('active');
                            return;
                        } else if (item.userData.type === 'coin') {
                            playSound('coin'); scene.remove(item); items.splice(i, 1);
                            score += 10; totalCoinsBank += 10;
                            document.getElementById('score').innerText = "Coins/Score: " + score;
                            let currentLevel = Math.floor(score / 80) + 1;
                            if (currentLevel > level) {
                                level = currentLevel; baseSpeed += 0.05; if(!isNitroActive) gameSpeed = baseSpeed;
                                document.getElementById('level').innerText = "Level: " + level;
                            }
                            continue;
                        }
                    }
                }
                if (item.position.z > 10) { scene.remove(item); items.splice(i, 1); }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
